[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamp_extensions"
version = "0.3.7"
description = "Extensions to SCAMP (Suite for Computer-Assisted Music in Python)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"

authors = [
    { name = "Marc Evanstein", email = "marc@marcevanstein.com" }
]

dependencies = [
    "scamp>=0.9.2",
    "expenvelope>=0.7.2",
    "clockblocks>=0.6.9",
    "numpy",
    "mido"
]

[project.urls]
"Source Code" = "https://git.sr.ht/~marcevanstein/scamp_extensions"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scamp_extensions = [
    "playback/supercollider/*.scd",
    "playback/supercollider/*.yaml",
    "playback/supercollider/scampExtensions/*"
]
